<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Kulzzy Chat</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#020b1b;
    color:#fff;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
    touch-action:manipulation;
}

.hidden{
    display:none!important;
}


/* =========================
   LOGIN
========================= */

#loginScreen{
    position:fixed;
    inset:0;
    background:#020b1b;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
}

.loginBox{
    width:100%;
    max-width:430px;
    background:#06152d;
    border:1px solid #c9a227;
    border-radius:20px;
    padding:30px 22px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.45);
}

.logoText{
    color:#ffd700;
    font-size:30px;
    font-weight:900;
    margin-bottom:5px;
}

.loginTitle{
    font-size:22px;
    font-weight:800;
    margin:15px 0 8px;
}

.loginSub{
    color:#b9c4d6;
    font-size:14px;
    line-height:1.5;
    margin-bottom:22px;
}

#nameInput{
    width:100%;
    height:50px;
    border:1px solid #43516a;
    background:#020b1b;
    color:#fff;
    border-radius:12px;
    padding:0 15px;
    outline:none;
}

#nameInput:focus{
    border-color:#ffd700;
}

.startBtn{
    width:100%;
    height:50px;
    margin-top:13px;
    border:0;
    border-radius:12px;
    background:#ffd700;
    color:#06152d;
    font-weight:900;
    font-size:16px;
}


/* =========================
   CHAT
========================= */

#chatScreen{
    position:fixed;
    inset:0;
    display:none;
    flex-direction:column;
    background:#020b1b;
}

#chatScreen.active{
    display:flex;
}


/* =========================
   HEADER
========================= */

.chatHeader{
    height:66px;
    min-height:66px;
    background:#06152d;
    border-bottom:1px solid #263653;
    display:flex;
    align-items:center;
    padding:0 14px;
    gap:12px;
}

.headerLogo{
    width:43px;
    height:43px;
    min-width:43px;
    border-radius:50%;
    background:#ffd700;
    color:#06152d;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:900;
}

.headerInfo{
    flex:1;
    min-width:0;
}

.headerTitle{
    font-size:17px;
    font-weight:900;
}

.headerStatus{
    color:#7ee787;
    font-size:12px;
    margin-top:3px;
}

.refreshBtn{
    border:0;
    background:transparent;
    color:#ffd700;
    font-size:23px;
    padding:8px;
}


/* =========================
   MESSAGES
========================= */

#messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:14px 10px 350px;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    touch-action:pan-y;
}

.emptyChat{
    height:100%;
    min-height:200px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#9da9bc;
    padding:30px;
}

.emptyInner{
    max-width:320px;
}

.emptyIcon{
    font-size:45px;
    margin-bottom:10px;
}

.messageRow{
    width:100%;
    display:flex;
    margin:5px 0;
}

.messageRow.user{
    justify-content:flex-end;
}

.messageRow.admin{
    justify-content:flex-start;
}

.messageBubble{
    max-width:82%;
    min-width:70px;
    padding:9px 11px;
    border-radius:14px;
    word-break:break-word;
}

.messageRow.user .messageBubble{
    background:#075eaa;
    border-bottom-right-radius:4px;
}

.messageRow.admin .messageBubble{
    background:#8b6d00;
    border-bottom-left-radius:4px;
}

.senderName{
    font-size:11px;
    font-weight:800;
    margin-bottom:4px;
    opacity:.8;
}

.messageText{
    font-size:15px;
    line-height:1.42;
    white-space:pre-wrap;
}

.messageTime{
    font-size:9px;
    opacity:.65;
    text-align:right;
    margin-top:5px;
}

.messageBubble img,
.messageBubble video{
    display:block;
    width:100%;
    max-width:290px;
    max-height:350px;
    border-radius:9px;
    object-fit:contain;
    background:#000;
}

.messageBubble audio{
    width:240px;
    max-width:100%;
}


/* =========================
   COMPOSER
========================= */

.composer{
    position:fixed;
    left:0;
    right:0;
    top:80%;
    transform:translateY(-50%);
    z-index:40;
    background:#06152d;
    border-top:1px solid #263653;
    border-bottom:1px solid #263653;
    padding:8px;
    flex-shrink:0;
}

.attachPreview{
    display:none;
    padding:7px;
    margin-bottom:7px;
    background:#020b1b;
    border:1px solid #374761;
    border-radius:10px;
}

.attachPreview.active{
    display:flex;
    align-items:center;
    gap:8px;
}

.previewName{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:12px;
}

.removeFile{
    border:0;
    background:#b00020;
    color:#fff;
    width:30px;
    height:30px;
    border-radius:50%;
}

.composerRow{
    display:flex;
    align-items:flex-end;
    gap:6px;
}

.iconBtn{
    width:43px;
    height:43px;
    flex:none;
    border:0;
    border-radius:50%;
    background:#102443;
    color:#ffd700;
    font-size:20px;
}

#messageInput{
    flex:1;
    min-width:0;
    max-height:120px;
    min-height:43px;
    resize:none;
    border:1px solid #40516d;
    border-radius:13px;
    background:#020b1b;
    color:#fff;
    padding:11px 13px;
    outline:none;
}

#messageInput:focus{
    border-color:#ffd700;
}

#sendBtn{
    width:46px;
    height:46px;
    flex:none;
    border:0;
    border-radius:50%;
    background:#ffd700;
    color:#06152d;
    font-size:19px;
    font-weight:900;
}

#sendBtn:disabled{
    opacity:.45;
}

.hiddenFile{
    display:none;
}


/* =========================
   RECORDING
========================= */

.recording{
    display:none;
    align-items:center;
    gap:8px;
    color:#ff6b6b;
    font-size:13px;
    padding:6px 5px;
    background:#06152d;
}

.recording.active{
    display:flex;
}

.recordDot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#ff3030;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{
        opacity:.2;
    }
}


/* =========================
   TOAST
========================= */

#toast{
    position:fixed;
    left:50%;
    bottom:80px;
    transform:translateX(-50%);
    background:#111d31;
    border:1px solid #ffd700;
    color:#fff;
    padding:10px 16px;
    border-radius:10px;
    font-size:13px;
    z-index:100;
    display:none;
    max-width:90%;
    text-align:center;
}

</style>
</head>

<body>


<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen">

    <div class="loginBox">

        <div class="logoText">
            KULZZY
        </div>

        <div class="loginTitle">
            KULZZY CHAT
        </div>

        <div class="loginSub">
            Chat privately with Kulzzy Radio.
            Enter your name to start your conversation.
        </div>

        <input
            id="nameInput"
            type="text"
            maxlength="60"
            placeholder="Enter your name"
            autocomplete="name"
        >

        <button
            class="startBtn"
            id="startBtn"
            type="button"
        >
            START CHAT
        </button>

    </div>

</section>


<!-- =========================
     CHAT
========================= -->

<section id="chatScreen">

    <header class="chatHeader">

        <div class="headerLogo">
            K
        </div>

        <div class="headerInfo">

            <div class="headerTitle">
                KULZZY RADIO
            </div>

            <div class="headerStatus">
                ● Online
            </div>

        </div>

        <button
            class="refreshBtn"
            id="refreshBtn"
            type="button"
            title="Refresh"
        >
            ↻
        </button>

    </header>


    <main id="messages">

        <div
            class="emptyChat"
            id="emptyChat"
        >

            <div class="emptyInner">

                <div class="emptyIcon">
                    💬
                </div>

                <div>
                    Your private conversation with
                    Kulzzy Radio will appear here.
                </div>

            </div>

        </div>

    </main>


    <div
        class="recording"
        id="recordingBar"
    >

        <span class="recordDot"></span>

        Recording voice note...

        <span id="recordTime">
            0:00
        </span>

    </div>


    <div class="composer">

        <div
            class="attachPreview"
            id="attachPreview"
        >

            <div
                class="previewName"
                id="previewName"
            ></div>

            <button
                class="removeFile"
                id="removeFile"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="composerRow">

            <button
                class="iconBtn"
                id="attachBtn"
                type="button"
                title="Attach picture or video"
            >
                +
            </button>

            <input
                id="fileInput"
                class="hiddenFile"
                type="file"
                accept="image/*,video/*"
            >


            <textarea
                id="messageInput"
                rows="1"
                maxlength="5000"
                placeholder="Type a message..."
            ></textarea>


            <button
                class="iconBtn"
                id="voiceBtn"
                type="button"
                title="Voice note"
            >
                🎤
            </button>


            <button
                id="sendBtn"
                type="button"
                title="Send"
            >
                ➤
            </button>

        </div>

    </div>

</section>


<div id="toast"></div>


<script>

/* =========================================================
   KULZZY CHAT
========================================================= */


/* =========================================================
   NEW APPS SCRIPT URL
========================================================= */

const API_URL =
    "https://script.google.com/macros/s/AKfycbyHb4d7HWRYHwT_sFB6hFV7Uap8yaiOy8SQclo7h73P1qF5jJUfzFH_I44hOA7Pz64C7Q/exec";


/* =========================================================
   CLOUDINARY
========================================================= */

const CLOUDINARY_UPLOAD_URL =
    "https://api.cloudinary.com/v1_1/s4j0x7dk/auto/upload";

const CLOUDINARY_UPLOAD_PRESET =
    "kulzzy_chat";


/* =========================================================
   STORAGE
========================================================= */

const USER_STORAGE_KEY =
    "kulzzy_new_chat_user";


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let selectedFile = null;

let mediaRecorder = null;

let recordedChunks = [];

let recordingStartedAt = 0;

let recordingTimer = null;

let refreshTimer = null;

let lastRenderedSignature = "";


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
    document.getElementById("loginScreen");

const chatScreen =
    document.getElementById("chatScreen");

const nameInput =
    document.getElementById("nameInput");

const startBtn =
    document.getElementById("startBtn");

const messagesBox =
    document.getElementById("messages");

const emptyChat =
    document.getElementById("emptyChat");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const attachBtn =
    document.getElementById("attachBtn");

const fileInput =
    document.getElementById("fileInput");

const voiceBtn =
    document.getElementById("voiceBtn");

const attachPreview =
    document.getElementById("attachPreview");

const previewName =
    document.getElementById("previewName");

const removeFile =
    document.getElementById("removeFile");

const recordingBar =
    document.getElementById("recordingBar");

const recordTime =
    document.getElementById("recordTime");

const refreshBtn =
    document.getElementById("refreshBtn");

const toast =
    document.getElementById("toast");


/* =========================================================
   STARTUP
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const saved =
            localStorage.getItem(
                USER_STORAGE_KEY
            );


        if(saved){

            try{

                currentUser =
                    JSON.parse(saved);


                if(
                    currentUser &&
                    currentUser.userId &&
                    currentUser.name
                ){

                    openChat();

                }

            }catch(error){

                console.error(error);

                localStorage.removeItem(
                    USER_STORAGE_KEY
                );

            }

        }

    }
);


/* =========================================================
   START CHAT
========================================================= */

startBtn.onclick =
    startChat;


nameInput.onkeydown =
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            startChat();

        }

    };


async function startChat(){

    const name =
        nameInput.value.trim();


    if(!name){

        showToast(
            "Please enter your name."
        );

        nameInput.focus();

        return;

    }


    startBtn.disabled =
        true;


    startBtn.textContent =
        "CONNECTING...";


    const userId =
        getOrCreateUserId();


    const code =
        getOrCreateUserCode();


    currentUser = {

        userId:userId,

        name:name,

        code:code

    };


    localStorage.setItem(
        USER_STORAGE_KEY,
        JSON.stringify(currentUser)
    );


    try{

        const result =
            await postData({

                action:"registerUser",

                userId:userId,

                name:name,

                code:code

            });


        /*
         * The POST is sent through a hidden iframe.
         * Therefore a successful submission is treated
         * as accepted by the server.
         */

        openChat();

        loadMessages();


    }catch(error){

        console.error(error);

        showToast(
            "Could not connect to chat server."
        );

        startBtn.disabled =
            false;

        startBtn.textContent =
            "START CHAT";

        return;

    }


    startBtn.disabled =
        false;

    startBtn.textContent =
        "START CHAT";

}


/* =========================================================
   USER ID
========================================================= */

function getOrCreateUserId(){

    let id =
        localStorage.getItem(
            "kulzzy_chat_user_id"
        );


    if(!id){

        id =
            "user_" +
            Date.now() +
            "_" +
            randomString(8);


        localStorage.setItem(
            "kulzzy_chat_user_id",
            id
        );

    }


    return id;

}


/* =========================================================
   USER CODE
========================================================= */

function getOrCreateUserCode(){

    let code =
        localStorage.getItem(
            "kulzzy_chat_user_code"
        );


    if(!code){

        code =
            "KULZZY" +
            Math.floor(
                100000 +
                Math.random() * 900000
            );


        localStorage.setItem(
            "kulzzy_chat_user_code",
            code
        );

    }


    return code;

}


/* =========================================================
   RANDOM STRING
========================================================= */

function randomString(length){

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";


    let result = "";


    for(
        let i = 0;
        i < length;
        i++
    ){

        result +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

    }


    return result;

}


/* =========================================================
   OPEN CHAT
========================================================= */

function openChat(){

    loginScreen.style.display =
        "none";


    chatScreen.classList.add(
        "active"
    );


    lastRenderedSignature =
        "";


    loadMessages();


    clearInterval(
        refreshTimer
    );


    refreshTimer =
        setInterval(
            loadMessages,
            5000
        );

}


/* =========================================================
   LOAD USER MESSAGES
========================================================= */

function loadMessages(){

    if(
        !currentUser ||
        !currentUser.userId
    ){

        return;

    }


    jsonp(
        "userMessages",
        {
            userId:
                currentUser.userId
        },
        function(result){

            if(
                !result ||
                !result.ok
            ){

                console.error(
                    "Chat read error:",
                    result
                );

                return;

            }


            renderMessages(
                result.messages || []
            );

        }
    );

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(list){

    list =
        Array.isArray(list)
            ? list
            : [];


    list.sort(
        function(a,b){

            return (
                Number(a.timestamp || 0) -
                Number(b.timestamp || 0)
            );

        }
    );


    const signature =
        list.map(
            function(m){

                return (
                    String(m.id || "") +
                    "|" +
                    String(m.timestamp || "") +
                    "|" +
                    String(m.text || "") +
                    "|" +
                    String(m.mediaUrl || "")
                );

            }
        ).join(",");


    if(
        signature ===
        lastRenderedSignature
    ){

        return;

    }


    lastRenderedSignature =
        signature;


    messagesBox.innerHTML =
        "";


    if(!list.length){

        messagesBox.appendChild(
            emptyChat
        );


        emptyChat.style.display =
            "flex";


        return;

    }


    emptyChat.style.display =
        "none";


    list.forEach(
        function(message){

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "messageRow " +
                (
                    message.sender === "admin"
                        ? "admin"
                        : "user"
                );


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "messageBubble";


            if(
                message.sender ===
                "admin"
            ){

                const sender =
                    document.createElement(
                        "div"
                    );


                sender.className =
                    "senderName";


                sender.textContent =
                    "KULZZY RADIO";


                bubble.appendChild(
                    sender
                );

            }


            if(message.text){

                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "messageText";


                text.textContent =
                    message.text;


                bubble.appendChild(
                    text
                );

            }


            if(
                message.mediaUrl &&
                message.type ===
                "image"
            ){

                const image =
                    document.createElement(
                        "img"
                    );


                image.src =
                    message.mediaUrl;


                image.alt =
                    "Image";


                image.loading =
                    "lazy";


                bubble.appendChild(
                    image
                );

            }


            if(
                message.mediaUrl &&
                message.type ===
                "video"
            ){

                const video =
                    document.createElement(
                        "video"
                    );


                video.src =
                    message.mediaUrl;


                video.controls =
                    true;


                video.preload =
                    "metadata";


                bubble.appendChild(
                    video
                );

            }


            if(
                message.mediaUrl &&
                message.type ===
                "audio"
            ){

                const audio =
                    document.createElement(
                        "audio"
                    );


                audio.src =
                    message.mediaUrl;


                audio.controls =
                    true;


                audio.preload =
                    "metadata";


                bubble.appendChild(
                    audio
                );

            }


            const time =
                document.createElement(
                    "div"
                );


            time.className =
                "messageTime";


            time.textContent =
                formatTime(
                    message.timestamp
                );


            bubble.appendChild(
                time
            );


            row.appendChild(
                bubble
            );


            messagesBox.appendChild(
                row
            );

        }
    );


    /*
     * Always show the newest message.
     */

    requestAnimationFrame(
        function(){

            messagesBox.scrollTop =
                messagesBox.scrollHeight;

        }
    );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

sendBtn.onclick =
    sendMessage;


messageInput.onkeydown =
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    };


async function sendMessage(){

    if(
        !currentUser ||
        !currentUser.userId
    ){

        return;

    }


    if(mediaRecorder){

        await stopRecording();

        return;

    }


    const text =
        messageInput.value.trim();


    if(
        !text &&
        !selectedFile
    ){

        return;

    }


    sendBtn.disabled =
        true;


    try{

        let mediaUrl =
            "";

        let type =
            "text";


        if(selectedFile){

            mediaUrl =
                await uploadToCloudinary(
                    selectedFile
                );


            type =
                getMediaType(
                    selectedFile.type
                );

        }


        const result =
            await postData({

                action:
                    "sendUserMessage",

                userId:
                    currentUser.userId,

                senderName:
                    currentUser.name,

                type:
                    type,

                text:
                    text,

                mediaUrl:
                    mediaUrl

            });


        if(
            !result ||
            result.ok === false
        ){

            throw new Error(
                result.error ||
                "Message send failed."
            );

        }


        messageInput.value =
            "";


        messageInput.style.height =
            "43px";


        clearSelectedFile();


        lastRenderedSignature =
            "";


        setTimeout(
            loadMessages,
            500
        );


    }catch(error){

        console.error(error);

        showToast(
            "Message could not be sent."
        );

    }


    sendBtn.disabled =
        false;

}


/* =========================================================
   ATTACHMENT
========================================================= */

attachBtn.onclick =
    function(){

        fileInput.click();

    };


fileInput.onchange =
    function(){

        if(
            !fileInput.files ||
            !fileInput.files[0]
        ){

            return;

        }


        selectedFile =
            fileInput.files[0];


        previewName.textContent =
            selectedFile.name;


        attachPreview.classList.add(
            "active"
        );

    };


removeFile.onclick =
    clearSelectedFile;


function clearSelectedFile(){

    selectedFile =
        null;


    fileInput.value =
        "";


    previewName.textContent =
        "";


    attachPreview.classList.remove(
        "active"
    );

}


/* =========================================================
   VOICE RECORDING
========================================================= */

voiceBtn.onclick =
    toggleRecording;


async function toggleRecording(){

    if(mediaRecorder){

        await stopRecording();

        return;

    }


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia ||
        typeof MediaRecorder ===
        "undefined"
    ){

        showToast(
            "Voice recording is not supported here."
        );

        return;

    }


    try{

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });


        recordedChunks =
            [];


        let mimeType =
            "";


        const choices = [

            "audio/webm;codecs=opus",

            "audio/webm",

            "audio/mp4",

            "audio/ogg;codecs=opus"

        ];


        for(
            let i = 0;
            i < choices.length;
            i++
        ){

            if(
                MediaRecorder.isTypeSupported(
                    choices[i]
                )
            ){

                mimeType =
                    choices[i];

                break;

            }

        }


        mediaRecorder =
            mimeType
                ? new MediaRecorder(
                    stream,
                    {
                        mimeType:
                            mimeType
                    }
                  )
                : new MediaRecorder(
                    stream
                  );


        mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size
                ){

                    recordedChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            async function(){

                stream
                    .getTracks()
                    .forEach(
                        function(track){

                            track.stop();

                        }
                    );


                const blob =
                    new Blob(
                        recordedChunks,
                        {
                            type:
                                mimeType ||
                                "audio/webm"
                        }
                    );


                mediaRecorder =
                    null;


                recordingBar.classList.remove(
                    "active"
                );


                clearInterval(
                    recordingTimer
                );


                recordTime.textContent =
                    "0:00";


                if(!blob.size){

                    return;

                }


                sendBtn.disabled =
                    true;


                try{

                    const file =
                        new File(
                            [blob],
                            "voice-note." +
                            getAudioExtension(
                                blob.type
                            ),
                            {
                                type:
                                    blob.type
                            }
                        );


                    const url =
                        await uploadToCloudinary(
                            file
                        );


                    const result =
                        await postData({

                            action:
                                "sendUserMessage",

                            userId:
                                currentUser.userId,

                            senderName:
                                currentUser.name,

                            type:
                                "audio",

                            text:
                                "",

                            mediaUrl:
                                url

                        });


                    if(
                        !result ||
                        result.ok === false
                    ){

                        throw new Error(
                            result.error ||
                            "Voice message failed."
                        );

                    }


                    lastRenderedSignature =
                        "";


                    setTimeout(
                        loadMessages,
                        500
                    );


                }catch(error){

                    console.error(error);

                    showToast(
                        "Voice note could not be sent."
                    );

                }


                sendBtn.disabled =
                    false;

            };


        mediaRecorder.start();


        recordingStartedAt =
            Date.now();


        recordingBar.classList.add(
            "active"
        );


        recordingTimer =
            setInterval(
                updateRecordingTime,
                500
            );


    }catch(error){

        console.error(error);

        showToast(
            "Microphone permission was denied."
        );

    }

}


async function stopRecording(){

    if(
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ){

        mediaRecorder.stop();

    }

}


/* =========================================================
   RECORDING TIMER
========================================================= */

function updateRecordingTime(){

    const seconds =
        Math.floor(
            (
                Date.now() -
                recordingStartedAt
            ) / 1000
        );


    const mins =
        Math.floor(
            seconds / 60
        );


    const secs =
        seconds % 60;


    recordTime.textContent =
        mins +
        ":" +
        String(secs).padStart(
            2,
            "0"
        );

}


/* =========================================================
   CLOUDINARY UPLOAD
========================================================= */

async function uploadToCloudinary(file){

    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    const response =
        await fetch(
            CLOUDINARY_UPLOAD_URL,
            {
                method:"POST",
                body:formData
            }
        );


    if(!response.ok){

        throw new Error(
            "Cloudinary upload failed."
        );

    }


    const result =
        await response.json();


    if(!result.secure_url){

        throw new Error(
            "Cloudinary returned no URL."
        );

    }


    return result.secure_url;

}


/* =========================================================
   MEDIA TYPE
========================================================= */

function getMediaType(mime){

    mime =
        String(
            mime || ""
        ).toLowerCase();


    if(
        mime.indexOf(
            "image/"
        ) === 0
    ){

        return "image";

    }


    if(
        mime.indexOf(
            "video/"
        ) === 0
    ){

        return "video";

    }


    return "text";

}


/* =========================================================
   AUDIO EXTENSION
========================================================= */

function getAudioExtension(type){

    type =
        String(
            type || ""
        ).toLowerCase();


    if(
        type.indexOf("mp4") !== -1
    ){

        return "mp4";

    }


    if(
        type.indexOf("ogg") !== -1
    ){

        return "ogg";

    }


    return "webm";

}


/* =========================================================
   SEND POST TO APPS SCRIPT
========================================================= */

function postData(data){

    return new Promise(
        function(resolve,reject){

            if(!API_URL){

                reject(
                    new Error(
                        "Backend URL missing."
                    )
                );

                return;

            }


            const iframe =
                document.createElement(
                    "iframe"
                );


            iframe.name =
                "kulzzyPost_" +
                Date.now() +
                "_" +
                Math.floor(
                    Math.random() * 100000
                );


            iframe.style.display =
                "none";


            document.body.appendChild(
                iframe
            );


            const form =
                document.createElement(
                    "form"
                );


            form.method =
                "POST";


            form.action =
                API_URL;


            form.target =
                iframe.name;


            form.style.display =
                "none";


            Object.keys(data).forEach(
                function(key){

                    const input =
                        document.createElement(
                            "input"
                        );


                    input.type =
                        "hidden";


                    input.name =
                        key;


                    input.value =
                        data[key] == null
                            ? ""
                            : String(
                                data[key]
                              );


                    form.appendChild(
                        input
                    );

                }
            );


            document.body.appendChild(
                form
            );


            let finished =
                false;


            function finish(){

                if(finished){

                    return;

                }


                finished =
                    true;


                try{
                    form.remove();
                }catch(e){}


                try{
                    iframe.remove();
                }catch(e){}


                resolve({
                    ok:true
                });

            }


            try{

                form.submit();

            }catch(error){

                try{
                    form.remove();
                }catch(e){}


                try{
                    iframe.remove();
                }catch(e){}


                reject(error);

                return;

            }


            /*
             * Allow enough time for Apps Script
             * to receive the POST request.
             */

            setTimeout(
                finish,
                2000
            );

        }
    );

}


/* =========================================================
   JSONP READ
========================================================= */

function jsonp(
    action,
    params,
    callback
){

    if(!API_URL){

        callback({

            ok:false,

            error:
                "Backend URL missing."

        });

        return;

    }


    const callbackName =
        "kulzzyCallback_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random() * 10000
        );


    const script =
        document.createElement(
            "script"
        );


    const query = {

        action:
            action,

        callback:
            callbackName

    };


    Object.keys(
        params || {}
    ).forEach(
        function(key){

            query[key] =
                params[key];

        }
    );


    const queryString =
        Object.keys(query)
            .map(
                function(key){

                    return (
                        encodeURIComponent(
                            key
                        ) +
                        "=" +
                        encodeURIComponent(
                            query[key]
                        )
                    );

                }
            )
            .join("&");


    let finished =
        false;


    function cleanup(){

        if(finished){

            return;

        }


        finished =
            true;


        try{

            delete window[
                callbackName
            ];

        }catch(e){}


        try{

            script.remove();

        }catch(e){}

    }


    window[callbackName] =
        function(data){

            cleanup();

            callback(data);

        };


    script.onerror =
        function(){

            cleanup();


            callback({

                ok:false,

                error:
                    "Unable to connect to chat server."

            });

        };


    script.src =
        API_URL +
        (
            API_URL.indexOf("?") >= 0
                ? "&"
                : "?"
        ) +
        queryString;


    document.body.appendChild(
        script
    );


    setTimeout(
        function(){

            if(finished){

                return;

            }


            cleanup();


            callback({

                ok:false,

                error:
                    "Chat server did not respond."

            });

        },
        15000
    );

}


/* =========================================================
   REFRESH
========================================================= */

refreshBtn.onclick =
    function(){

        lastRenderedSignature =
            "";


        loadMessages();

    };


/* =========================================================
   TEXTAREA AUTO SIZE
========================================================= */

messageInput.oninput =
    function(){

        this.style.height =
            "43px";


        this.style.height =
            Math.min(
                this.scrollHeight,
                120
            ) + "px";

    };


/* =========================================================
   TIME
========================================================= */

function formatTime(timestamp){

    if(!timestamp){

        return "";

    }


    const date =
        new Date(
            Number(timestamp)
        );


    if(
        isNaN(
            date.getTime()
        )
    ){

        return "";

    }


    return date.toLocaleTimeString(
        [],
        {
            hour:"numeric",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer =
    null;


function showToast(message){

    toast.textContent =
        message;


    toast.style.display =
        "block";


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.style.display =
                    "none";

            },
            3000
        );

}
